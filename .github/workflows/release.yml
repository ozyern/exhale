name: Release

# Push a tag and the release builds itself. Android and Windows release separately, each
# under its own tag, so either can ship without the other:
#
#   git tag v1.0.103 && git push origin v1.0.103                  Android: the APK
#   git tag v1.0.103-windows && git push origin v1.0.103-windows  Windows: the setup
#
# Each app's updater only looks at its own: Windows at the -windows releases, Android at
# the rest.
#
# The tag is the source of truth for the version: the job refuses to build if the
# tag and `versionName` in app/build.gradle.kts disagree, because a release whose
# tag says 1.0.103 and whose APK reports 1.0.102 will never stop offering itself as
# an update to its own users.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (v1.0.103 for Android, v1.0.103-windows for Windows)'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ !endsWith(github.event.inputs.tag || github.ref_name, '-windows') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag against versionName
        run: |
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=${{ steps.tag.outputs.version }}  gradle=$GRADLE_VERSION"
          if [ "${{ steps.tag.outputs.version }}" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag v$GRADLE_VERSION expected — the tag and versionName must match."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives in secrets, never in the repository. Without it the build
      # would silently fall back to the debug key (see app/build.gradle.kts), so this
      # step fails loudly instead — a debug-signed APK on a release page cannot be
      # replaced later by a properly signed one.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the three signing secrets before tagging a release."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      # One APK. Splitting by ABI saved about a megabyte and cost a decision nobody
      # outside this repository can make — a release page that asks whether you are
      # arm64, armeabi-v7a, x86 or x86_64 is a page most people close.
      - name: Build the release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleUniversalRelease

      # Gradle names it after the module. The published name carries the version, so a
      # file sitting in someone's Downloads folder says which build it is.
      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/universal/release/app-universal-release.apk \
             "out/Exhale-${{ steps.tag.outputs.version }}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The notes come out of CHANGELOG.md so the release page, the website and the
      # app's own changelog screen cannot disagree about what shipped.
      - name: Extract the release notes
        run: |
          python3 - <<'PY' > out/NOTES.md
          import re, io
          version = "${{ steps.tag.outputs.version }}"
          text = io.open('CHANGELOG.md', encoding='utf-8').read()
          start = text.find(f'## [{version}]')
          if start == -1:
              print(f'Exhale {version}.')
          else:
              body = text[start:]
              nxt = re.search(r'\n## \[', body[1:])
              print(body[: nxt.start() + 1] if nxt else body)
          PY
          head -20 out/NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Exhale ${{ steps.tag.outputs.version }}" \
            --notes-file out/NOTES.md \
            "out/Exhale-${{ steps.tag.outputs.version }}.apk" \
            out/SHA256SUMS.txt

  # A release made with github.token does not fire other workflows' release
  # events, but a workflow_dispatch does go through. The site build pulls the new
  # APK into the F-Droid repo.
  fdroid:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the site and its F-Droid repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "${{ github.repository }}" --ref master

  # The Windows setup, attached to the same release. Exhale's own installer
  # (desktop/installer/ExhaleSetup.cs) carries the app image inside it, so signing
  # happens twice: the app's own files before they are packed, then the setup itself.
  # Signing goes through SignPath once these repository settings exist:
  #   variables  SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
  #   secret     SIGNPATH_API_TOKEN
  # with two artifact configurations in the SignPath project, "app" and "setup" (see
  # .signpath/). Until then the setup is published unsigned.
  windows:
    if: ${{ endsWith(github.event.inputs.tag || github.ref_name, '-windows') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-windows}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The Windows app reports versionName as its version, and its updater compares that with the tag.
      - name: Check the tag against versionName
        shell: bash
        run: |
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=${{ steps.tag.outputs.version }}  gradle=$GRADLE_VERSION"
          if [ "${{ steps.tag.outputs.version }}" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag v$GRADLE_VERSION-windows expected — the tag and versionName must match."
            exit 1
          fi

      # The JetBrains Runtime SDK, with jpackage: the installed app keeps its custom title bar on it.
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch libmpv
        shell: pwsh
        run: ./desktop/scripts/fetch-libmpv.ps1

      - name: Build the app image and uninstaller
        shell: pwsh
        env:
          EXHALE_PACKAGE_JDK: ${{ env.JAVA_HOME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: ./desktop/scripts/build-installer.ps1 -Stage Prepare -Unsigned

      - name: Upload the app for signing
        id: app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: exhale-app-unsigned
          path: desktop/build/installer/stage/
          retention-days: 1

      # Waits for the release to be approved in SignPath, then puts the signed files back.
      - name: Sign the app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: desktop/build/installer/stage-signed

      - name: Use the signed app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Remove-Item desktop/build/installer/stage -Recurse -Force
          Move-Item desktop/build/installer/stage-signed desktop/build/installer/stage

      - name: Build the setup
        shell: pwsh
        run: ./desktop/scripts/build-installer.ps1 -Stage Package -Unsigned

      - name: Upload the setup for signing
        id: setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: exhale-setup-unsigned
          path: desktop/build/installer/Exhale-Setup-${{ steps.tag.outputs.version }}.exe
          retention-days: 1

      - name: Sign the setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: out/signed

      # Its own release, named as the tag: "Exhale 1.0.103-windows". The Windows updater checks its
      # download against the checksum list attached beside it.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETUP="Exhale-Setup-${{ steps.tag.outputs.version }}.exe"
          mkdir -p out
          if [ -f "out/signed/$SETUP" ]; then cp "out/signed/$SETUP" out/; else cp "desktop/build/installer/$SETUP" out/; fi
          cd out
          sha256sum "$SETUP" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Exhale ${{ steps.tag.outputs.version }}-windows" \
            --notes "Exhale ${{ steps.tag.outputs.version }} for Windows. Run the setup to install or update; Exhale also offers it in the app." \
            "$SETUP" SHA256SUMS.txt
