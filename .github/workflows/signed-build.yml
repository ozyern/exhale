name: Signed build

# A release-signed APK without a release: push a `build/*` branch (or run this by hand on any
# branch) and the APK is attached to the run as an artifact. Nothing is published, so the in-app
# updater never sees it. Use it to test a build on a phone that has the release installed.
on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # The same key as the release builds (release.yml), so the APK installs over them.
      - name: Restore the signing keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          DATA="${KEYSTORE:-$KEYSTORE_BASE64}"
          if [ -z "$DATA" ]; then
            echo "::error::Neither KEYSTORE nor KEYSTORE_BASE64 is set."
            exit 1
          fi
          mkdir -p app/keystore
          echo "$DATA" | base64 -d > app/keystore/release.keystore

      - name: Build the release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FALLBACK_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="${KEYSTORE_PASSWORD:-$FALLBACK_STORE_PASSWORD}"
          chmod +x gradlew
          ./gradlew assembleUniversalGmsRelease -PgithubUpdater=true --no-configuration-cache --console=plain --warning-mode summary -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: Exhale-${{ github.sha }}
          path: app/build/outputs/apk/universalGms/release/*.apk
          retention-days: 1

      # R8's mapping for this exact build: a crash report's obfuscated trace (r8-map-id) is only
      # readable with the mapping from the build that produced it.
      - uses: actions/upload-artifact@v4
        with:
          name: Exhale-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/universalGmsRelease/mapping.txt
          retention-days: 30
