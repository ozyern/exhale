name: Update downloads badge

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count downloads (GitHub releases + SourceForge)
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          github=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '[.[].assets[] | .download_count] | add // 0')
          # SourceForge's all-time file downloads for the project.
          sourceforge=$(curl -fsSL --retry 3 \
            "https://sourceforge.net/projects/exhale-music/files/stats/json?start_date=2000-01-01&end_date=$(date -u +%F)" \
            | jq -r '.total // 0') || sourceforge=""
          if ! [[ "$sourceforge" =~ ^[0-9]+$ ]]; then
            # SourceForge unreachable: keep the published number rather than drop its share.
            echo "SourceForge count unavailable; leaving the badge as it is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total=$((github + sourceforge))
          formatted=$(printf '%s' "$total" | rev | sed 's/[0-9][0-9][0-9]/&,/g' | rev | sed 's/^,//')
          echo "GitHub: $github, SourceForge: $sourceforge, total: $total"
          echo "formatted=$formatted" >> "$GITHUB_OUTPUT"

      - name: Write badge data
        if: steps.count.outputs.skip != 'true'
        env:
          DOWNLOADS: ${{ steps.count.outputs.formatted }}
        run: |
          # Drawn by shields.io (endpoint badge) in the README's for-the-badge style.
          jq -n --arg m "$DOWNLOADS" \
            '{schemaVersion: 1, label: "downloads", message: $m, color: "F5B700"}' > assets/downloads.json

      - name: Publish badge when changed
        if: steps.count.outputs.skip != 'true'
        run: |
          if git diff --quiet -- assets/downloads.json; then
            echo "Downloads unchanged at ${{ steps.count.outputs.formatted }}"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/downloads.json
          git commit -m "chore: update downloads badge"
          git push
