name: Website

# Builds the marketing site in website/ and publishes it to GitHub Pages at
# exhale.ozyern.me, with the F-Droid repository at /fdroid/repo. Only runs when
# the site or the repo's listing changes — an app-only commit should not
# redeploy the site. release.yml dispatches it after every release so the
# F-Droid repo picks up the new APK.
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'fdroid/**'
      - 'fastlane/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. `cancel-in-progress: false` so a queued deploy
# finishes rather than being dropped when two commits land together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages serves one artifact per repository, so the F-Droid repo rides along
      # inside the site. Without its signing secrets the site still deploys.
      - name: Build the F-Droid repository
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$FDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::FDROID_KEYSTORE_BASE64 is not set; deploying the site without the F-Droid repo."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver
          bash fdroid/build-repo.sh website/dist/fdroid

      # `enablement` turns Pages on AND sets its source to this workflow. Without
      # it a repository whose Pages source is still "deploy from a branch" keeps
      # serving Jekyll's rendering of README.md no matter how often this runs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
