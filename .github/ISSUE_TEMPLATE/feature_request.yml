name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For open-ended questions, use [Discussions](https://github.com/ozyern/exhale/discussions) instead.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this hasn't been requested.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Player
        - Playback and audio
        - Lyrics
        - Library, playlists or downloads
        - Search
        - Settings
        - Look and animations
        - Accounts and integrations
        - Listen Together
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you ran into it.
      placeholder: "Right now it is hard to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: Mockups or screenshots
      description: Drop images or sketches here if you have them.
    validations:
      required: false
