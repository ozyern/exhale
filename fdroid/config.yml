# fdroidserver configuration for Exhale's own F-Droid repository, served from
# exhale.ozyern.me/fdroid/repo. The APKs are not built here: build-repo.sh pulls
# the signed ones off the GitHub releases page and indexes them.

repo_url: https://exhale.ozyern.me/fdroid/repo
repo_name: Exhale
repo_icon: icon.png
repo_description: >-
  The official F-Droid repository for Exhale. Every APK here is the same signed
  build that is published on github.com/ozyern/exhale/releases.

# Only the current releases are kept; there is no archive repo.
archive_older: 0

# The index signing key. It is the repository's identity: the fingerprint in the
# "add repo" link comes from it, so a new key means every user re-adds the repo.
# CI restores it from the FDROID_KEYSTORE_BASE64 secret.
keystore: keystore.p12
repo_keyalias: exhale-fdroid
keystorepass:
  env: FDROID_KEYSTORE_PASS
keypass:
  env: FDROID_KEYSTORE_PASS
keydname: CN=Exhale F-Droid, O=ozyern
